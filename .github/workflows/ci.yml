name: CI

# The Go checks for a pull request, for the modules it touches only: ghost-go when
# ghost-go/ changed, ghost-server when ghost-server/ or ghost-go/ (which it compiles in)
# changed. A change to this file checks both. Nothing is built here: the ghost-server
# image is built for a release (publish.yml).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      modules: ${{ steps.filter.outputs.changes }}
      ghost-go: ${{ steps.filter.outputs.ghost-go }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ghost-go:
              - 'ghost-go/**'
              - '.github/workflows/ci.yml'
            ghost-server:
              - 'ghost-server/**'
              - 'ghost-go/**'
              - '.github/workflows/ci.yml'

  go:
    name: ${{ matrix.module }} (ubuntu)
    needs: changes
    if: needs.changes.outputs.modules != '[]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ghost-go","ghost-server"]') || fromJSON(needs.changes.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            ghost-go/go.sum
            ghost-server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}

  windows:
    name: ghost-go (windows)
    needs: changes
    if: needs.changes.outputs.ghost-go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ghost-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ghost-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
