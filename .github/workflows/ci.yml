name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: v2.13.2

jobs:
  go:
    name: ${{ matrix.module }} (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ghost-go, ghost-server]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            ghost-go/go.sum
            ghost-server/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}

  windows:
    name: ghost-go (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ghost-go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ghost-go/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  docker:
    name: ghost-server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ghost-server/Dockerfile
          push: false
          load: true
          tags: ghost-server:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
