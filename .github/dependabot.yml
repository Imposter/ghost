version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /ghost-go
      - /ghost-server
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ghost-server
    schedule:
      interval: weekly
